# 1B Parameter Ternary Transformer Configuration
# Use only after validating 500M model works

model:
  d_model: 2048
  n_layers: 24
  n_heads: 16
  d_ff: 8192
  vocab_size: 50257
  max_seq_len: 2048
  threshold_factor: 0.7
  ternary_temperature: 0.15
  dropout: 0.0
  rope_theta: 10000.0
  dtype: bfloat16

training:
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  warmup_steps: 5000
  weight_decay: 0.1
  gradient_clip: 0.5
  ternary_skip_steps: 1000
  ternary_fadein_steps: 1000
  batch_size: 2
  gradient_accumulation_steps: 16
  max_steps: 100000
  eval_interval: 500
  save_interval: 2000
  log_interval: 10
  scale_update_interval: 500
  checkpoint_layers: 4
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  sequence_length: 1024
  output_dir: checkpoints/1b

