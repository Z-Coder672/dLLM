# 500M Parameter Ternary Transformer Configuration
# FINAL CONSENSUS CONFIG - Claude + Gemini v5
# Optimized for M2 Mac Mini (16GB RAM)
# Effective Batch Size: 16,384 tokens per update (1 x 32 x 512)
# Expected training time: 3-4 months continuous

model:
  d_model: 1024
  n_layers: 24
  n_heads: 16
  d_ff: 4096
  vocab_size: 50257
  max_seq_len: 1024                # Keep at 1024 for potential future use
  threshold_factor: 0
  ternary_temperature: 0
  dropout: 0.0                     # No dropout for pre-training
  rope_theta: 10000.0
  dtype: bfloat16

training:
  # ============================================================================
  # OPTIMIZER & LEARNING RATE - CONSENSUS SETTINGS
  # ============================================================================
  optimizer: adamw                 # Explicit optimizer specification
  learning_rate: 0.0005            # 5e-4: Balanced between speed and stability
  min_learning_rate: 0.00001       # 1e-5: Lower floor for sharper final decay
  weight_decay: 0.01               # CRITICAL FIX: Down from 0.1
  betas: [0.9, 0.998]               # Modern LLM practice (LLaMA-style)
  eps: 1.0e-8                      # Standard epsilon
  gradient_clip: 1.0               # Up from 0.5 for more stability headroom
  
  # ============================================================================
  # LEARNING RATE SCHEDULE
  # ============================================================================
  lr_schedule: "cosine"            # Safer than WSD for constrained 30k run
  warmup_steps: 3000               # 10% of training (down from 5000)
  max_steps: 30000
  stop_steps: 0                    # No early stopping
  
  # ============================================================================
  # BATCHING & MEMORY STRATEGY - THE CRITICAL FIX
  # ============================================================================
  batch_size: 1                    # Memory-constrained for M2 Mac
  gradient_accumulation_steps: 32  # UP FROM 8 - This is the key stability fix
  sequence_length: 512             # Training sequence length
  
  # Effective batch = 1 × 32 × 512 = 16,384 tokens per optimizer update
  # This is 4x larger than original (4,096 tokens) which caused collapse
  
  # ============================================================================
  # TERNARY SETTINGS (DISABLED)
  # ============================================================================
  # Training in full bf16 precision - ternary never activates
  ternary_skip_steps: 
  ternary_fadein_steps: 1000000000
  
  # ============================================================================
  # CHECKPOINTING & LOGGING
  # ============================================================================
  eval_interval: 200               # Evaluate every 200 steps
  save_interval: 200               # Save checkpoints every 200 steps (up from 200)
  log_interval: 5                  # Log metrics every 5 steps
  scale_update_interval: 500       # Loss scale update frequency
  checkpoint_layers: 4             # Gradient checkpointing for memory efficiency
  
  # ============================================================================
  # DATA CONFIGURATION
  # ============================================================================
  datasets:
    - name: "HuggingFaceTB/cosmopedia-v2"
      config: "cosmopedia-v2"
      weight: 0.5                  # 50% synthetic educational data
    - name: "mlfoundations/dclm-baseline-1.0"
      weight: 0.3                  # 30% curated web data
    - name: "HuggingFaceFW/fineweb-edu"
      config: "sample-10BT"
      weight: 0.2                  # 20% educational web data
  
  streaming: true                  # Stream data for memory efficiency
  output_dir: checkpoints/500m
